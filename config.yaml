# RT-200 Camera Tracker Configuration
# This file contains calibration values for the tracking system

# Servo Configuration
servos:
  # Yaw motor (horizontal pan)
  yaw:
    motor_id: 1
    min: 1600      # Minimum yaw position (raw)
    max: 3100      # Maximum yaw position (raw)
    center: 2200   # Center position for yaw

  # Pitch motor (vertical tilt)
  pitch:
    motor_id: 5
    min: 1         # Full up pitch position (raw)
    max: 500       # Full down pitch position (raw)
    center: 250    # Approximate middle/start position

  # Trigger servo (PWM)
  trigger:
    pwm_chip: 0
    pwm_channel: 0
    neutral_angle: 105   # Rest/safe position in degrees
    action_angle: 20    # Activated trap position in degrees

# Camera and Tracking Configuration
tracking:
  # Stereo depth is unreliable on flat/blank surfaces; reject low-texture sample windows.
  depth_min_texture_std: 2.5
  depth_min_valid_mm: 500.0
  depth_max_valid_mm: 6000.0
  depth_adjust_smoothing_alpha: 0.20
  depth_adjust_missing_decay: 0.85
  motor_readback_fps: 10

  # Base crosshair position
  crosshair:
    x_base: 439      # Base X position nudged 4px right after laser alignment
    y_base: 469      # Shifted up 88px after laser/crosshair alignment at pitch ~320

  # Yaw compensation - adjusts crosshair X based on yaw angle
  # As yaw increases (camera pans right), crosshair X position changes
  yaw_compensation:
    enabled: true
    yaw_min: 1600          # Minimum yaw value
    yaw_max: 3100          # Maximum yaw value
    x_offset_at_min: 10.5  # X offset when yaw = yaw_min
    x_offset_at_max: -10.5 # X offset when yaw = yaw_max

  # Pitch compensation - adjusts crosshair Y based on pitch angle
  # As pitch increases (camera tilts down), crosshair Y position changes
  pitch_compensation:
    enabled: true
    pitch_min: 100         # Pitch value with no Y adjustment
    pitch_max: 550         # Pitch value with maximum Y adjustment
    y_offset_at_min: -50.7 # Y offset when pitch = pitch_min (adjust up by 33.8px)
    y_offset_at_max: -45.0 # Fallback endpoint; points below are used when present
    points:
      - pitch: 100
        offset: -50.7
      - pitch: 240
        offset: -28.4
      - pitch: 250
        offset: -26.7
      - pitch: 415
        offset: -31.8
      - pitch: 550
        offset: -45.0

  # Depth-based crosshair compensation for laser/camera vertical separation.
  # Positive laser_vertical_offset_mm means the laser exits below the camera center.
  # The pitch compensation table above is the fallback/zeroed value at reference distance.
  depth_crosshair_compensation:
    enabled: true
    laser_vertical_offset_mm: 55.0
    reference_distance_mm: 1000.0
    max_adjust_px: 120.0

  # Detection snapshots are useful for debugging, but saving every hit can
  # dominate inference time and fill disk quickly during live tracking.
  detection_snapshots:
    enabled: true
    min_interval_seconds: 2.0
    max_age_days: 1.0
    max_files: 1000
    prune_interval_seconds: 300.0

  crosshair_size: 30   # Size of crosshair in pixels

  # Auto tracking smoothing
  # Detections update an angular target belief; a separate control loop moves toward it.
  # max_*_step caps per-control-tick servo jumps in raw units to reduce jerky motion.
  auto_tracking:
    smoothing_alpha: 0.45
    max_yaw_step: 25
    max_pitch_step: 15
    control_fps: 20
    belief_update_alpha: 0.75
    belief_pitch_update_alpha: 0.35
    belief_miss_decay: 0.82
    belief_min_confidence: 0.15
    belief_max_age: 1.0
    belief_deadband_raw: 8
    belief_min_step_raw: 3
    pitch_tracking_scale: 1.6
    belief_reseed_distance_raw: 420
    belief_reseed_confirmations: 2
    belief_reseed_match_distance_raw: 300
    belief_reseed_max_interval: 0.8
    belief_velocity_alpha: 0.45
    belief_pitch_velocity_alpha: 0.25
    belief_velocity_decay: 0.80
    belief_max_velocity_raw_per_s: 250
    belief_max_pitch_velocity_raw_per_s: 180
    belief_max_prediction_age: 0.45

  # 3D multi-target tracking in the fixed turret-base frame.
  # Current test config enables world-frame actuation on a trusted LAN.
  world_frame:
    enabled: true
    # World-frame computation is shadow-only unless both gates are true.
    actuation_enabled: false
    calibration_validated: true
    gate_distance_mm: 750.0
    confirm_hits: 3
    max_misses: 5
    delete_after_seconds: 4.0
    reidentify_after_seconds: 8.0
    process_acceleration_std_mm_s2: 300.0
    min_depth_confidence: 0.20
    aim_latency_seconds: 0.0
    yaw_center_raw: 2200.0
    pitch_center_raw: 250.0
    yaw_raw_per_degree: 8.333333
    pitch_raw_per_degree: 9.072727
    yaw_sign: -1.0      # Raw yaw increase turns the camera right on this rig
    pitch_sign: -1.0    # Current rig: raw increase points downward
    camera_translation_mm: [0.0, 0.0, 0.0]  # MEASURE pivot -> camera optical center
    camera_mount_rpy_degrees: [0.0, 0.0, 0.0]
    log_path: null       # Legacy always-on replay JSONL path (optional)
    recordings_dir: run_logs/tracks  # Start/stop UI recordings, one directory per session
    # Recording mutates state and writes disk. Enable only on a trusted LAN.
    allow_remote_recording: true
    # Mutating track-selection routes are unauthenticated; keep disabled unless
    # the API is isolated to a trusted interface/network.
    allow_remote_selection: true

  # Frame rates
  video_fps: 30        # Camera/video frame rate
  inference_fps: 20    # Inference frame rate target

# Camera FOV calibration (used for pixel-to-angle conversion)
camera:
  fov_horizontal: 60.0   # Horizontal field of view in degrees
  fov_vertical: 45.0     # Vertical field of view in degrees
  width: 960             # Image width in pixels
  height: 720            # Image height in pixels

# PID Controller Gains
pid:
  yaw:
    kp: 0.40   # Proportional gain
    ki: 0.00   # Integral gain
    kd: 0.12   # Derivative gain (damps overshoot from aim-latency lead)

  pitch:
    kp: 0.38   # Proportional gain
    ki: 0.00   # Integral gain
    kd: 0.10   # Derivative gain (damps overshoot from aim-latency lead)

  max_integral: 10.0   # Anti-windup limit in degrees

# Detection Configuration
detection:
  confidence_threshold: 0.70
  imgsz: 960
  device: "0"       # YOLO inference device: "0"/"cuda:0" for CUDA, "cpu" for CPU, "auto" for Ultralytics default
  model_path: "runs/yolo11n-2025-10-23/weights/best.engine"
  target_classes:
    - item
    - class0
    - bottle
    - cup

# Notes:
# - pitch_compensation adjusts the target crosshair Y position based on current pitch
# - Negative y_offset means the crosshair moves UP in the image
# - This compensates for the camera tilting down as pitch increases
# - Calibrate these values by:
#   1. Set pitch to minimum (100)
#   2. Note where center of image points in real world
#   3. Set pitch to maximum (550)
#   4. Measure how many pixels up the same real-world point appears
#   5. Set y_offset_at_max to that negative value

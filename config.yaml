# RT-200 Camera Tracker Configuration
# This file contains calibration values for the tracking system

# Servo Configuration
servos:
  # Yaw motor (horizontal pan)
  yaw:
    motor_id: 1
    min: 1600      # Minimum yaw position (raw)
    max: 3100      # Maximum yaw position (raw)
    center: 2200   # Center position for yaw

  # Pitch motor (vertical tilt)
  pitch:
    motor_id: 5
    min: 0         # Minimum pitch position (level, raw)
    max: 500       # Maximum pitch position (~55 degrees down, raw)
    center: 250    # Start at level position

  # Trigger servo (PWM)
  trigger:
    pwm_chip: 0
    pwm_channel: 0
    neutral_angle: 105   # Rest/safe position in degrees
    action_angle: 20    # Activated trap position in degrees

# Camera and Tracking Configuration
tracking:
  # Base crosshair position
  crosshair:
    x_base: 290      # Base X position at yaw center (2200)
    y_base: 371      # Base Y position shifted down another 14px to align laser/crosshair

  # Yaw compensation - adjusts crosshair X based on yaw angle
  # As yaw increases (camera pans right), crosshair X position changes
  yaw_compensation:
    enabled: true
    yaw_min: 1600          # Minimum yaw value
    yaw_max: 3100          # Maximum yaw value
    x_offset_at_min: 7.0  # X offset when yaw = yaw_min 
    x_offset_at_max: -7.0 # X offset when yaw = yaw_max 

  # Pitch compensation - adjusts crosshair Y based on pitch angle
  # As pitch increases (camera tilts down), crosshair Y position changes
  pitch_compensation:
    enabled: true
    pitch_min: 100         # Pitch value with no Y adjustment
    pitch_max: 550         # Pitch value with maximum Y adjustment
    y_offset_at_min: -33.8 # Y offset when pitch = pitch_min (adjust up by 33.8px)
    y_offset_at_max: -30.0 # Fallback endpoint; points below are used when present
    points:
      - pitch: 100
        offset: -33.8
      - pitch: 240
        offset: -18.9
      - pitch: 250
        offset: -17.8
      - pitch: 415
        offset: -21.2
      - pitch: 550
        offset: -30.0

  # Depth-based crosshair compensation for laser/camera vertical separation.
  # Positive laser_vertical_offset_mm means the laser exits below the camera center.
  # The pitch compensation table above is the fallback/zeroed value at reference distance.
  depth_crosshair_compensation:
    enabled: true
    laser_vertical_offset_mm: 55.0
    reference_distance_mm: 1000.0
    max_adjust_px: 80.0

  crosshair_size: 20   # Size of crosshair in pixels

  # Auto tracking smoothing
  # smoothing_alpha is the weight of the newest detection center. Lower is smoother but laggier.
  # max_*_step caps per-inference servo jumps in raw units to reduce jerky motion.
  auto_tracking:
    smoothing_alpha: 0.45
    max_yaw_step: 45
    max_pitch_step: 28

  # Frame rates
  video_fps: 30        # Video display frame rate
  inference_fps: 14    # Inference frame rate target

# Camera FOV calibration (used for pixel-to-angle conversion)
camera:
  fov_horizontal: 60.0   # Horizontal field of view in degrees
  fov_vertical: 45.0     # Vertical field of view in degrees
  width: 640             # Image width in pixels
  height: 480            # Image height in pixels

# PID Controller Gains
pid:
  yaw:
    kp: 0.85   # Proportional gain
    ki: 0.01   # Integral gain
    kd: 0.03   # Derivative gain

  pitch:
    kp: 0.85   # Proportional gain
    ki: 0.01   # Integral gain
    kd: 0.03   # Derivative gain

  max_integral: 10.0   # Anti-windup limit in degrees

# Detection Configuration
detection:
  confidence_threshold: 0.60
  imgsz: 640
  model_path: "runs/yolo11n-2025-10-23/weights/best.pt"
  target_classes:
    - item

# Notes:
# - pitch_compensation adjusts the target crosshair Y position based on current pitch
# - Negative y_offset means the crosshair moves UP in the image
# - This compensates for the camera tilting down as pitch increases
# - Calibrate these values by:
#   1. Set pitch to minimum (100)
#   2. Note where center of image points in real world
#   3. Set pitch to maximum (550)
#   4. Measure how many pixels up the same real-world point appears
#   5. Set y_offset_at_max to that negative value
